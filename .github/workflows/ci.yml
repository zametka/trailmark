name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: release binary and synthetic eval
        run: |
          export RUSTFLAGS="--remap-path-prefix=${HOME}/.cargo/registry=/cargo/registry --remap-path-prefix=${HOME}/.cargo/git=/cargo/git --remap-path-prefix=${HOME}/.rustup=/rustup --remap-path-prefix=${GITHUB_WORKSPACE}=/trailmark"
          cargo build --release
          python3 -I eval/trail_eval.py synthetic target/release/trailmark --random 20
          if strings target/release/trailmark | grep -E '/Users/|/home/'; then
            echo "release binary embeds a home path"
            exit 1
          fi

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.87.0
      - name: check on the minimum supported Rust
        run: cargo check --all-targets
